<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>EMV QR Ödənişi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4ff, #f9fbff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .payment-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .payment-card h1 {
            margin-bottom: 5px;
            font-size: 24px;
            color: #1f2a44;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .qr-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #e5e7eb;
        }

        .qr-container p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .qr-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 14px;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-placeholder {
            text-align: center;
            color: #9ca3af;
        }

        .qr-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .qr-box img {
            display: none;
            max-width: 240px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .payment-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="payment-card">
    <h1>EMV QR Ödənişi</h1>
    <div class="subtitle">Təhlükəsiz və sürətli ödəniş</div>

    <div class="form-group">
        <label for="amount">Məbləğ (AZN)</label>
        <input type="number" id="amount" placeholder="Məs: 25.50"/>
    </div>

    <button onclick="generateQr()">QR Yarat</button>

    <div class="qr-container">
        <p>QR kodu skan edin</p>

        <div class="qr-box">
            <div id="qrPlaceholder" class="qr-placeholder">
                <div class="qr-icon">▦</div>
                <span>QR kod yaradılacaq</span>
            </div>

            <img id="qrImage" alt="QR kod"/>
        </div>
    </div>
</div>

<script>
    async function generateQr() {
        const amount = document.getElementById("amount").value;

        if (!amount || amount <= 0) {
            alert("Zəhmət olmasa düzgün məbləğ daxil edin");
            return;
        }

        const requestBody = {
            type: "DYNAMIC",
            channel: "MERCHANT",
            currency: "AZN",
            bankBic: "VTBAZ020",
            aliasValue: "FR7630006000011234567890189",
            aliasType: "IBAN",
            amount: parseFloat(amount),
            merchantName: "My Shop",
            merchantCity: "Baku",
            merchantCategoryCode: "5812",
            terminalId: "123456"
        };

        try {
            const response = await fetch("http://localhost:8080/v1/qr-operations", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error("Backend-dən cavab alınmadı");
            }

            const data = await response.json();

            const qrImage = document.getElementById("qrImage");
            const placeholder = document.getElementById("qrPlaceholder");

            qrImage.src = "data:image/png;base64," + data.content;
            qrImage.style.display = "block";
            placeholder.style.display = "none";

        } catch (err) {
            alert("Xəta baş verdi: " + err.message);
        }
    }
</script>

</body>
</html>
