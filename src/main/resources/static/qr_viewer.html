<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AZQR Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #6b7280;
            font-size: 14px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .required {
            color: #dc2626;
        }

        input,
        select {
            width: 100%;
            height: 42px;
            padding: 0 12px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            background: #ffffff;

            font-size: 14px;
            outline: none;

            transition: border-color 0.15s ease,
            box-shadow 0.15s ease;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        input:disabled,
        select:disabled {
            background: #f3f4f6;
            cursor: not-allowed;
        }

        .hint {
            margin-top: 5px;
            font-size: 11px;
            color: #9ca3af;
        }

        button {
            width: 100%;
            height: 46px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: background 0.15s ease,
            transform 0.05s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .error {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border-radius: 8px;

            background: #fee2e2;
            color: #b91c1c;

            font-size: 14px;
        }

        .result {
            display: none;

            margin-top: 30px;
            padding-top: 25px;

            border-top: 1px solid #e5e7eb;
        }

        .success {
            margin-bottom: 20px;

            text-align: center;

            color: #15803d;
            font-size: 15px;
            font-weight: 700;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 30px;
        }

        .qr-image {
            display: block;

            width: 280px;
            height: 280px;

            max-width: 100%;

            object-fit: contain;

            border: 1px solid #e5e7eb;
            border-radius: 10px;

            padding: 10px;

            background: white;
        }

        .result-section {
            margin-top: 22px;
        }

        .result-title {
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;

            color: #111827;
        }

        .code-box {
            width: 100%;

            padding: 15px;

            background: #111827;
            color: #e5e7eb;

            border-radius: 8px;

            font-family: "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            monospace;

            font-size: 12px;
            line-height: 1.6;

            white-space: pre-wrap;
            word-break: break-all;

            overflow-x: auto;
        }

        .payload-box {
            padding: 18px;

            background: #0f172a;
            color: #e2e8f0;

            border: 1px solid #1e293b;
            border-radius: 10px;

            font-family: "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            monospace;

            font-size: 13px;
            line-height: 1.7;

            word-break: break-all;
            overflow-wrap: anywhere;

            min-height: 60px;
        }

        .payload-label {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        .payload-badge {
            display: inline-flex;
            align-items: center;

            padding: 4px 8px;

            border-radius: 5px;

            background: #dbeafe;
            color: #1d4ed8;

            font-size: 10px;
            font-weight: 700;
        }

        .empty-payload {
            color: #94a3b8;
            font-style: italic;
        }

        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .qr-image {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AZQR Generator</h1>

    <div class="subtitle">
        AZQR məlumatlarını daxil edin və QR kod yaradın.
    </div>


    <!-- ========================= -->
    <!-- QR CONFIGURATION -->
    <!-- ========================= -->

    <div class="section">

        <div class="section-title">
            QR Configuration
        </div>

        <div class="grid">

            <div class="field">

                <label for="type">
                    QR Type
                    <span class="required">*</span>
                </label>

                <select id="type">

                    <option value="DYNAMIC">
                        DYNAMIC
                    </option>

                    <option value="STATIC">
                        STATIC
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="channel">
                    Channel
                    <span class="required">*</span>
                </label>

                <select id="channel">

                    <option value="MERCHANT">
                        MERCHANT
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- BANK -->
    <!-- ========================= -->

    <div class="section">

        <div class="section-title">
            Bank / Terminal
        </div>

        <div class="grid">

            <div class="field">

                <label for="bankBic">
                    Bank BIC
                    <span class="required">*</span>
                </label>

                <input
                        id="bankBic"
                        type="text"
                        value="VTBAZ020"
                        placeholder="VTBAZ020"
                >

            </div>


            <div class="field">

                <label for="terminalId">
                    Terminal ID
                    <span class="required">*</span>
                </label>

                <input
                        id="terminalId"
                        type="text"
                        value="123456"
                        placeholder="Terminal ID"
                >

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SUBJECT -->
    <!-- ========================= -->

    <div class="section">

        <div class="section-title">
            Subject Identifier
        </div>

        <div class="grid">

            <div class="field">

                <label for="aliasType">
                    Alias Type
                    <span class="required">*</span>
                </label>

                <select id="aliasType">

                    <option value="PIN">
                        PIN
                    </option>

                    <option value="MOBILE_NUMBER">
                        MOBILE NUMBER
                    </option>

                    <option value="EMAIL">
                        EMAIL
                    </option>

                    <option value="IBAN" selected>
                        IBAN
                    </option>

                    <option value="TAX_ID">
                        TAX ID
                    </option>

                    <option value="MERCHANT_ID">
                        MERCHANT ID
                    </option>

                    <option value="OBJECT_CODE">
                        OBJECT CODE
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="aliasValue">
                    Alias Value
                    <span class="required">*</span>
                </label>

                <input
                        id="aliasValue"
                        type="text"
                        value="FR7630006000011234567890189"
                        placeholder="IBAN / PIN / Mobile / Email"
                >

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- TRANSACTION -->
    <!-- ========================= -->

    <div class="section">

        <div class="section-title">
            Transaction
        </div>

        <div class="grid">

            <div class="field">

                <label for="currency">
                    Currency
                    <span class="required">*</span>
                </label>

                <select id="currency">

                    <option value="AZN">
                        AZN
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="amount">
                    Amount
                </label>

                <input
                        id="amount"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="25.50"
                >

                <div class="hint">
                    DYNAMIC QR üçün məcburidir.
                </div>

            </div>


            <div class="field">

                <label for="merchantCategoryCode">
                    Merchant Category Code
                    <span class="required">*</span>
                </label>

                <input
                        id="merchantCategoryCode"
                        type="text"
                        value="5812"
                        maxlength="4"
                        placeholder="5812"
                >

                <div class="hint">
                    4 rəqəm olmalıdır.
                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- MERCHANT -->
    <!-- ========================= -->

    <div class="section">

        <div class="section-title">
            Merchant
        </div>

        <div class="grid">

            <div class="field">

                <label for="merchantName">
                    Merchant Name
                    <span class="required">*</span>
                </label>

                <input
                        id="merchantName"
                        type="text"
                        value="My Shop"
                        maxlength="25"
                        placeholder="Merchant Name"
                >

            </div>


            <div class="field">

                <label for="merchantCity">
                    Merchant City
                    <span class="required">*</span>
                </label>

                <input
                        id="merchantCity"
                        type="text"
                        value="Baku"
                        maxlength="15"
                        placeholder="Baku"
                >

            </div>


            <div class="field">

                <label for="countryCode">
                    Country Code
                </label>

                <input
                        id="countryCode"
                        type="text"
                        value="AZ"
                        maxlength="2"
                        placeholder="AZ"
                >

            </div>


            <div class="field">

                <label for="postalCode">
                    Postal Code
                </label>

                <input
                        id="postalCode"
                        type="text"
                        maxlength="10"
                        placeholder="AZ1000"
                >

            </div>


            <div class="field full">

                <label for="coordinates">
                    Coordinates
                </label>

                <input
                        id="coordinates"
                        type="text"
                        maxlength="16"
                        placeholder="Optional"
                >

                <div class="hint">
                    Optional AZQR coordinates.
                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- GENERATE -->
    <!-- ========================= -->

    <button
            id="generateButton"
            onclick="generateQr()">

        AZQR Yarat

    </button>


    <!-- ========================= -->
    <!-- ERROR -->
    <!-- ========================= -->

    <div
            id="error"
            class="error">
    </div>


    <!-- ========================= -->
    <!-- RESULT -->
    <!-- ========================= -->

    <div
            id="result"
            class="result">

        <div class="success">
            AZQR uğurla yaradıldı
        </div>


        <!-- QR -->

        <div class="qr-container">

            <img
                    id="qrImage"
                    class="qr-image"
                    alt="AZQR"
            >

        </div>


        <!-- ========================= -->
        <!-- REQUEST -->
        <!-- ========================= -->

        <div class="result-section">

            <div class="result-title">
                Göndərilən Request
            </div>

            <div
                    id="requestJson"
                    class="code-box">
            </div>

        </div>


        <!-- ========================= -->
        <!-- PAYLOAD -->
        <!-- ========================= -->

        <div class="result-section">

            <div class="payload-label">

                <div class="result-title" style="margin: 0;">
                    AZQR Payload
                </div>

                <span class="payload-badge">
                    TLV
                </span>

            </div>

            <div
                    id="payload"
                    class="payload-box">
            </div>

        </div>

    </div>

</div>


<script>

    const typeElement =
        document.getElementById("type");

    const amountElement =
        document.getElementById("amount");


    /*
     * ============================================
     * DYNAMIC / STATIC
     * ============================================
     */

    typeElement.addEventListener(
        "change",
        updateAmountState
    );


    function updateAmountState() {

        if (typeElement.value === "DYNAMIC") {

            amountElement.required = true;

            amountElement.placeholder =
                "Məs: 25.50";

        } else {

            amountElement.required = false;

            amountElement.placeholder =
                "Optional";
        }
    }


    /*
     * ============================================
     * GENERATE QR
     * ============================================
     */

    async function generateQr() {

        const button =
            document.getElementById(
                "generateButton"
            );

        const errorElement =
            document.getElementById(
                "error"
            );

        const resultElement =
            document.getElementById(
                "result"
            );

        const qrImage =
            document.getElementById(
                "qrImage"
            );


        /*
         * Reset
         */

        errorElement.style.display =
            "none";

        resultElement.style.display =
            "none";


        /*
         * Read values
         */

        const type =
            document.getElementById(
                "type"
            ).value;

        const channel =
            document.getElementById(
                "channel"
            ).value;

        const bankBic =
            document.getElementById(
                "bankBic"
            ).value.trim();

        const aliasType =
            document.getElementById(
                "aliasType"
            ).value;

        const aliasValue =
            document.getElementById(
                "aliasValue"
            ).value.trim();

        const currency =
            document.getElementById(
                "currency"
            ).value;

        const amountValue =
            document.getElementById(
                "amount"
            ).value;

        const terminalId =
            document.getElementById(
                "terminalId"
            ).value.trim();

        const merchantName =
            document.getElementById(
                "merchantName"
            ).value.trim();

        const merchantCity =
            document.getElementById(
                "merchantCity"
            ).value.trim();

        const merchantCategoryCode =
            document.getElementById(
                "merchantCategoryCode"
            ).value.trim();

        const countryCode =
            document.getElementById(
                "countryCode"
            ).value.trim();

        const postalCode =
            document.getElementById(
                "postalCode"
            ).value.trim();

        const coordinates =
            document.getElementById(
                "coordinates"
            ).value.trim();


        /*
         * ============================================
         * VALIDATION
         * ============================================
         */

        if (!bankBic) {

            return showError(
                "Bank BIC daxil edin."
            );
        }


        if (!aliasValue) {

            return showError(
                "Alias Value daxil edin."
            );
        }


        if (!terminalId) {

            return showError(
                "Terminal ID daxil edin."
            );
        }


        if (!merchantName) {

            return showError(
                "Merchant Name daxil edin."
            );
        }


        if (!merchantCity) {

            return showError(
                "Merchant City daxil edin."
            );
        }


        /*
         * MCC
         */

        if (
            !/^\d{4}$/.test(
                merchantCategoryCode
            )
        ) {

            return showError(
                "Merchant Category Code 4 rəqəm olmalıdır."
            );
        }


        /*
         * Country Code
         */

        if (
            countryCode &&
            !/^[A-Za-z]{2}$/.test(
                countryCode
            )
        ) {

            return showError(
                "Country Code 2 hərf olmalıdır."
            );
        }


        /*
         * Dynamic amount
         */

        if (
            type === "DYNAMIC"
        ) {

            if (
                !amountValue ||
                Number(amountValue) <= 0
            ) {

                return showError(
                    "DYNAMIC QR üçün amount daxil edin."
                );
            }
        }


        /*
         * ============================================
         * REQUEST
         * ============================================
         */

        const request = {

            type: type,

            channel: channel,

            bankBic: bankBic,

            aliasType: aliasType,

            aliasValue: aliasValue,

            currency: currency,

            amount:
                amountValue
                    ? Number(amountValue)
                    : null,

            terminalId: terminalId,

            merchantName: merchantName,

            merchantCity: merchantCity,

            merchantCategoryCode:
            merchantCategoryCode,

            countryCode:
                countryCode || null,

            postalCode:
                postalCode || null,

            coordinates:
                coordinates || null
        };


        console.log(
            "AZQR Request:",
            request
        );


        /*
         * Loading
         */

        button.disabled = true;

        button.innerText =
            "AZQR yaradılır...";


        try {

            /*
             * ========================================
             * BACKEND
             * ========================================
             */

            const response =
                await fetch(
                    "/v1/qr-operations",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                request
                            )
                    }
                );


            /*
             * ========================================
             * HTTP ERROR
             * ========================================
             */

            if (!response.ok) {

                let message =
                    "Backend xətası.";


                try {

                    const errorData =
                        await response.json();


                    message =
                        errorData.message ||
                        errorData.error ||
                        message;

                } catch (e) {

                    // Non-JSON response
                }


                throw new Error(
                    message
                );
            }


            /*
             * ========================================
             * RESPONSE
             * ========================================
             *
             * Expected:
             *
             * {
             *     "content": "BASE64...",
             *     "payload": "000201..."
             * }
             */

            const data =
                await response.json();


            /*
             * QR content
             */

            if (!data.content) {

                throw new Error(
                    "Backend QR content qaytarmadı."
                );
            }


            /*
             * ========================================
             * QR IMAGE
             * ========================================
             */

            qrImage.src =
                "data:image/png;base64," +
                data.content;


            /*
             * ========================================
             * REQUEST JSON
             * ========================================
             */

            document.getElementById(
                "requestJson"
            ).textContent =
                JSON.stringify(
                    request,
                    null,
                    2
                );


            /*
             * ========================================
             * PAYLOAD
             * ========================================
             */

            const payloadElement =
                document.getElementById(
                    "payload"
                );


            if (data.payload) {

                payloadElement.textContent =
                    data.payload;

            } else {

                payloadElement.innerHTML = `
                    <span class="empty-payload">
                        Backend response-da payload yoxdur.
                    </span>
                `;
            }


            /*
             * ========================================
             * SHOW RESULT
             * ========================================
             */

            resultElement.style.display =
                "block";


        } catch (e) {

            console.error(
                "AZQR Error:",
                e
            );


            showError(
                "QR yaratmaq mümkün olmadı: " +
                e.message
            );


        } finally {

            button.disabled = false;

            button.innerText =
                "AZQR Yarat";
        }
    }


    /*
     * ============================================
     * ERROR
     * ============================================
     */

    function showError(message) {

        const errorElement =
            document.getElementById(
                "error"
            );


        errorElement.innerText =
            message;


        errorElement.style.display =
            "block";
    }


    /*
     * ============================================
     * INITIAL STATE
     * ============================================
     */

    updateAmountState();

</script>

</body>
</html>
